# Ayla 直播：SRS 自定义配置
# 基于官方 conf/docker.conf + HTTPS（供手机跨设备访问直播）。
# 证书：mkcert 生成（./certs/cert.pem + key.pem），docker-compose 挂载到 ./conf/cert/。
# 改动生效：docker compose restart srs

listen              1935;
max_connections     1000;
srs_log_tank        console;
daemon              off;

# SRS HTTP API（后端 apps/live/srs.py 内部查询状态用，保持 127.0.0.1 默认无需 https）
http_api {
    enabled         on;
    listen          1985;
}

# 播放服务器：8080 = HTTP-FLV/HLS；8089 = HTTPS-FLV/HLS（8088 被本机 RuoYi 项目占用，故用 8089）
http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
    https {
        enabled     on;
        listen      8089;
        key         ./conf/cert/key.pem;
        cert        ./conf/cert/cert.pem;
    }
}

rtc_server {
    enabled on;
    listen 8000; # UDP port
    # @see https://ossrs.net/lts/zh-cn/docs/v4/doc/webrtc#config-candidate
    candidate $CANDIDATE;
}

vhost __defaultVhost__ {
    # 2026-11-01 直播性能优化：GOP=1s 前提下分片 1s/窗口 10s/gop_cache off
    # （推流端已把关键帧间隔压到 1s；分片 1s 才有意义，窗口 10s 只保留最后 ~10 片）
    hls {
        enabled         on;
        hls_fragment    1;
        hls_window      10;
    }
    # 2026-11-01 直播性能优化：GOP=1s 前提下分片 1s/窗口 10s/gop_cache off
    # gop_cache off：新观众不吃历史 GOP 积压，直接等下一个 I 帧（GOP=1s 时最多 ~1s）
    play {
        gop_cache       off;
        queue_length    5;
        mw_latency      200;
    }
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }
    rtc {
        enabled     on;
        # @see https://ossrs.net/lts/zh-cn/docs/v4/doc/webrtc#rtmp-to-rtc
        rtmp_to_rtc on;
        # @see https://ossrs.net/lts/zh-cn/docs/v4/doc/webrtc#rtc-to-rtmp
        rtc_to_rtmp on;
    }
}
