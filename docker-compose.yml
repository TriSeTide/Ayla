# Elysia 独立应用 —— 基础设施编排（M4-1 基座）
# 仅编排基础设施：MySQL 8 / Redis 7 / MinIO / SRS。
# Django 应用本地开发用 venv 直接跑，生产再补应用容器。
# 历史：LiveKit（M4-5 语音 SFU）已于 2026-09-12 退役——frp 穿透会改写 UDP 源地址，
# WebRTC/TURN 媒体面不可用；语音改走 ws 音频中继（见 web/src/livekit/wsRelayRoom.ts）。
services:
  mysql:
    image: mysql:8.0
    container_name: elysia-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-elysia_dev_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-elysia}
      MYSQL_USER: ${MYSQL_USER:-elysia}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-elysia_dev_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-elysia_dev_root}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: elysia-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: elysia-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-elysia_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-elysia_minio_pass}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 控制台
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  # M4-6 直播：SRS 流媒体服务器（RTMP 推流 + HTTP-FLV/HLS 播放 + HTTP API 状态）。
  # 1935 RTMP；8080 HTTP-FLV/HLS；1985 HTTP API + WebRTC 信令；8000/udp WebRTC 媒体。
  # 自定义配置 ./srs.conf（含 HTTPS，挂载覆盖镜像默认 conf/docker.conf），证书 mkcert 挂载自 ./certs。
  # 8089（https）不再对外映射：本地模拟远端部署形态，https 拉流统一走下方 nginx
  #（宿主 8089 → nginx 8443 → srs 容器内 8089），SRS 容器内 https 仅服务转发。
  srs:
    image: ossrs/srs:5
    container_name: elysia-srs
    restart: unless-stopped
    ports:
      - "1935:1935"
      - "8080:8080"
      - "1985:1985"
      - "8000:8000/udp"
    volumes:
      - ./srs.conf:/usr/local/srs/conf/docker.conf:ro
      - ./certs:/usr/local/srs/conf/cert:ro
    healthcheck:
      # SRS 容器精简（无 curl/wget），用 bash /dev/tcp 探测 HTTP API 端口
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/1985'"]
      interval: 10s
      timeout: 3s
      retries: 12

  # 本地模拟远端部署：Nginx 拉流入口（转发 SRS https 8089）。
  # 对齐 deploy/examples/nginx.conf.example 的拉流入口语义（远端 host 网络 8443 → SRS），
  # 本地差异：容器网络 upstream（compose 服务名 srs）+ 宿主 8088 → 容器 8443，
  # 使局域网以 https://<局域网IP>:8088/live/... 访问（外部设备无需 SRS 直连证书）。
  # 监听 0.0.0.0：局域网完全可达（远端靠 frpc 打到 127.0.0.1，本地不依赖穿透）。
  # 注：前端（vite 手动起）与后端（daphne 手动起）不容器化、不静态托管，nginx 仅做拉流。
  nginx:
    image: docker.m.daocloud.io/library/nginx:stable-alpine
    container_name: ayla-nginx
    restart: unless-stopped
    ports:
      - "8088:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - srs

volumes:
  mysql_data:
  redis_data:
  minio_data:
