# Elysia 独立应用 —— 基础设施编排（M4-1 基座）
# 仅编排基础设施：MySQL 8 / Redis 7 / MinIO。
# Django 应用本地开发用 venv 直接跑，生产再补应用容器。
services:
  mysql:
    image: mysql:8.0
    container_name: elysia-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-elysia_dev_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-elysia}
      MYSQL_USER: ${MYSQL_USER:-elysia}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-elysia_dev_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-elysia_dev_root}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: elysia-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: elysia-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-elysia_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-elysia_minio_pass}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 控制台
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  # M4-5 语音：LiveKit SFU（WebRTC 多人语音房间，真人用户之间走 LiveKit）。
  # key/secret 生成后写进 backend/.env（LIVEKIT_API_KEY / LIVEKIT_API_SECRET），不提交仓库。
  # 端口约定（与 livekit.yaml 的 rtc 段对应，含 UDP 媒体映射——缺 UDP 会导致
  # 浏览器「could not establish pc connection」）：
  #   7880/tcp  WS 信令 + HTTP
  #   7881/tcp  RTC over TCP
  #   7882-7886/udp  RTC 媒体（UDP）
  livekit:
    # v1.13 系列：兼容 livekit-client 2.x（/rtc/v1 信令路径 + 更高协议版本）。
    # 旧 v1.7 与 livekit-client 2.21 协议不匹配（客户端降级连 /rtc 后立即断开）。
    image: livekit/livekit-server:v1.13
    container_name: elysia-livekit
    restart: unless-stopped
    command: --config /livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_KEYS:-devkey: devsecret}"
    ports:
      - "7880:7880/tcp"   # WS 信令 + HTTP
      - "7881:7881/tcp"   # RTC over TCP
      - "7882-7886:7882-7886/udp"   # RTC 媒体（UDP）
    volumes:
      - ./livekit.yaml:/livekit.yaml:ro
      - ./certs:/livekit/certs:ro
      - livekit_data:/livekit
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:7880/"]
      interval: 10s
      timeout: 3s
      retries: 12

  # M4-6 直播：SRS 流媒体服务器（RTMP 推流 + HTTP-FLV/HLS 播放 + HTTP API 状态）。
  # 1935 RTMP；8080 HTTP-FLV/HLS；8088 HTTPS-FLV/HLS；1985 HTTP API + WebRTC 信令；8000/udp WebRTC 媒体。
  # 自定义配置 ./srs.conf（含 HTTPS，挂载覆盖镜像默认 conf/docker.conf），证书 mkcert 挂载自 ./certs。
  srs:
    image: ossrs/srs:5
    container_name: elysia-srs
    restart: unless-stopped
    ports:
      - "1935:1935"
      - "8080:8080"
      - "8088:8088"
      - "1985:1985"
      - "8000:8000/udp"
    volumes:
      - ./srs.conf:/usr/local/srs/conf/docker.conf:ro
      - ./certs:/usr/local/srs/conf/cert:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:1985/api/v1/versions"]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  mysql_data:
  redis_data:
  minio_data:
  livekit_data:
