# Ayla 本地模拟远端部署：Nginx 拉流入口（转发 SRS）。
#
# 模板来源：deploy/examples/nginx.conf.example 的"拉流专用入口"块（远端 frp 服务器，
# host 网络 127.0.0.1:8443 → SRS 8089）。本地的差异：
#   1. 容器网络：upstream 用 compose 服务名 srs（远端是 127.0.0.1 host 网络）；
#   2. 监听 0.0.0.0（宿主映射 8089 → 容器 8443）：局域网内以 https://<局域网IP>:8089
#      直接访问（远端靠 frpc 打到 127.0.0.1，本地不依赖穿透）。
# 职责：仅服务 /live/ 流文件（m3u8/flv/ts）→ SRS https 8089；其余 404（不暴露网页/API）。
#
# 生效：文件级 bind-mount —— 修改后 docker compose restart nginx（或 reload）。

server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 相对路径跳转，避免 Location 泄漏内部端口
    absolute_redirect off;
    port_in_redirect on;

    # 拉流：/live/*.m3u8|flv|ts（含 SRS hls_ctx 查询参数）→ SRS 容器内 https 8089
    location ~ ^/live/.+\.(m3u8|flv|ts)(\?.*)?$ {
        proxy_pass https://srs:8089;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }

    # 其余一律 404（不暴露网页/API/信令）
    location / {
        return 404;
    }
}
