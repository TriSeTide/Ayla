name: ayla_flutter
description: "Ayla 多端客户端（Windows / Android / iOS）。"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.9.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  web_socket_channel: ^3.0.3
  record: ^6.2.1
  video_player: ^2.10.1
  # media_kit 系：PoC-A 期间曾暂移除（其 Windows mpv 运行库 GitHub 下载受阻），
  # PoC-B 前 mpv 已成功下载并校验（build/windows/x64/，MD5 a832ef24），恢复启用。
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  # ⚠️ 只有 **Windows** 的 media_kit 运行库。Android/iOS 上没有 libmpv，
  # 因此移动端的音频**不能**走 media_kit（2026-10 用户实报「手机端无法播放语音」
  # 的根因）——移动端语音内核见下面 just_audio。
  media_kit_libs_windows_video: ^1.0.11
  # 移动端（Android/iOS）语音播放内核：底层是系统原生播放器
  # （ExoPlayer / AVPlayer），原生支持 m4a/AAC 与 HTTP Range 流式，
  # 且 AudioSource.uri(headers:) 能透传 Authorization（语音要鉴权）。
  # 平台分派见 lib/core/media/audio_playback.dart 的 createAylaAudioEngine()。
  just_audio: ^0.10.5
  path_provider: ^2.1.5
  ffi: ^2.2.0

  # M0 基座：状态管理 / 路由 / HTTP 客户端（06 §3.1）
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  file_picker: ^13.1.0
  flutter_secure_storage: ^11.2.0
  # 客户端自更新（2026-10-18）：版本号读取 / 下载校验 / 解包 / 打开安装页。
  # 三者此前已是传递依赖（pubspec.lock 已有），这里改为直接依赖以明确契约。
  package_info_plus: ^10.2.1
  crypto: ^3.0.7
  archive: ^4.3.0
  url_launcher: ^6.3.2
  livekit_client: ^2.13.2
  # 直接依赖（原本只是传递依赖）：语音房需要调用 vendor 补丁新增的
  # Helper.selectAudioOutputDetailed 拿回设备切换的内核回执。
  # 版本由下面 dependency_overrides 指到 third_party/flutter_webrtc。
  flutter_webrtc: ^1.6.3
  flutter_foreground_task: ^11.0.3
  # 桌面端**真·全屏**（直播全屏键）：纯 HWND 变换（SetWindowLong style/WS_POPUP +
  # SetWindowPos 覆盖整块显示器），同一个 Flutter engine，不新建窗口。
  # 选它而不是自己写 Win32 全屏：本仓库 Windows runner 已有 NCCALCSIZE/frame 计算，
  # 两套 owner 会互相抢边框重算 ⇒ 进出全屏闪烁（研究结论，见 live_player.dart 注释）。
  window_manager: ^0.5.2
  # 图标：线性 SVG 风格（05 纪律 6：禁止 emoji 当功能图标）。
  # 不用 lucide_icons pub 包：0.257.0 的 LucideIconData extends IconData 在
  # Flutter 3.47 上编译失败（IconData 已是 final class，实测构建中断）；
  # web 端本身也是手写 path（components/icons.tsx），故移植同一份 path 数据到
  # lib/theme/app_icons.dart，形状与 web 逐条一致（详见该文件头注释）。
dev_dependencies:
  flutter_test:
    sdk: flutter

  # 测试用：ws_manager_test 的 _FakeWs 继承 StreamChannelMixin（web_socket_channel 传递依赖，
  # 显式声明避免 depend_on_referenced_packages）
  stream_channel: ^2.1.2

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0

# ===== 本地 vendor 覆盖（**有意的、必须保留**）=====
# 见 third_party/flutter_webrtc/README-AYLA.md：
# Windows 上「运行中切换播放端点」在 livekit_client/flutter_webrtc 的公开 API 里
# 无法观测（SelectAudioOutput 只返回 success/failure，拿不到命中设备、ADM 返回码、
# 枚举顺序）。用户实报「日志打印已切到耳机，声音仍在扬声器」就是被这个黑箱卡住的。
# 该 vendor 补丁只**增加诊断回执**，不改变切换语义；升级 flutter_webrtc 时
# 必须把 common/cpp/src/flutter_media_stream.cc 的 SelectAudioOutput 补丁重新打上。
# media_kit_video 的 vendor 补丁：Windows 上「直播小窗脱离应用」需要**第二个
# Flutter engine**，而 media_kit_video 2.0.1 的 windows 插件有进程级单例
# `static MediaKitVideoPlugin* instance_` —— 第二个 engine 注册插件会覆盖它，
# 于是静态 WindowProcDelegate 把 kMainThreadTaskMessage 派给错误的引擎，
# **主窗口**的 VideoController.create() 永久挂起（上游 media-kit#1383，OPEN）
# ⇒ 主窗口直播黑屏。补丁把 instance_ 换成 std::unordered_map<HWND, ...>。
# 详见 third_party/media_kit_video/README-AYLA.md。
dependency_overrides:
  flutter_webrtc:
    path: third_party/flutter_webrtc
  media_kit_video:
    path: third_party/media_kit_video

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # M0 字体：三字体离线打包（05 §1 字体行 + 坑 10：不用 google_fonts 运行时联网）
  # 文件：@expo-google-fonts 静态 ttf（latin 覆盖）；CJK 走 fontFamilyFallback（app_theme.dart）
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Fredoka_600SemiBold.ttf
          weight: 600
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito_700Bold.ttf
          weight: 700
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk_400Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk_500Medium.ttf
          weight: 500
